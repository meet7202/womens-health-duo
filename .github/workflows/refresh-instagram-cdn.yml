# Refresh expired Instagram reel CDN URLs → verify → push main → deploy.
# Skips PRs (this repo blocks GITHUB_TOKEN from opening pull requests).

name: Refresh Instagram CDN

on:
  schedule:
    # 04:00 UTC daily (~09:30 IST)
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Re-fetch all reels even when current CDN URL still works"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-instagram-cdn
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh reel CDN URLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Install dependencies
        run: npm ci

      - name: Refresh CDN URLs
        id: refresh
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ inputs.force_all }}" = "true" ]; then
            ARGS="--all"
          fi
          node scripts/refresh-instagram-cdn.mjs $ARGS || {
            code=$?
            if [ "$code" -eq 1 ] && git diff --quiet -- src/data/knowledgeHubInstagramReels.json; then
              echo "Refresh had fetch errors but no file changes; continuing."
              exit 0
            fi
            exit "$code"
          }
          if git diff --quiet -- src/data/knowledgeHubInstagramReels.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Format changed files
        if: steps.refresh.outputs.has_changes == 'true'
        run: npx prettier --write src/data/knowledgeHubInstagramReels.json

      - name: Verify
        if: steps.refresh.outputs.has_changes == 'true'
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run build
          npm run audit:seo-titles
          npm run audit:seo-descriptions
          npm run audit:seo-h1
          npm run audit:seo-headings
          npm run audit:seo-sitemap
        env:
          VITE_SITE_URL: https://womenshealthduo.com

      - name: Push to main
        if: steps.refresh.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/knowledgeHubInstagramReels.json
          git diff --staged --quiet && exit 0
          git commit -m "Refresh Instagram reel CDN URLs"
          git push origin HEAD:main

      - name: Trigger GitHub Pages deploy
        if: steps.refresh.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-github-pages.yml --ref main
