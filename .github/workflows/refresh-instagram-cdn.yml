# Refresh expired Instagram reel CDN URLs (daily PR when URLs change)

name: Refresh Instagram CDN

on:
  schedule:
    # 04:00 UTC daily (~09:30 IST)
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Re-fetch all reels even when current CDN URL still works"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-instagram-cdn
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh reel CDN URLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Install dependencies
        run: npm ci

      - name: Refresh CDN URLs
        id: refresh
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ inputs.force_all }}" = "true" ]; then
            ARGS="--all"
          fi
          node scripts/refresh-instagram-cdn.mjs $ARGS
          if git diff --quiet -- src/data/knowledgeHubInstagramReels.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Format changed files
        if: steps.refresh.outputs.has_changes == 'true'
        run: npx prettier --write src/data/knowledgeHubInstagramReels.json

      - name: Verify
        if: steps.refresh.outputs.has_changes == 'true'
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run build
          npm run audit:seo-titles
          npm run audit:seo-descriptions
          npm run audit:seo-h1
          npm run audit:seo-headings
          npm run audit:seo-sitemap
        env:
          VITE_SITE_URL: https://womenshealthduo.com

      - name: Create pull request
        if: steps.refresh.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: learn/refresh-instagram-cdn-${{ github.run_id }}
          delete-branch: true
          commit-message: "Refresh Instagram reel CDN URLs"
          title: "Learn hub: refresh Instagram CDN URLs"
          body: |
            Automated CDN refresh from [Refresh Instagram CDN](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Updates only `instagramVideoUrl` and `instagramPosterUrl` in `knowledgeHubInstagramReels.json` (playback / poster fallback — not used in JSON-LD or video sitemap).
            Titles, captions, watch page ids, and other indexed fields are unchanged.

            Merge to restore inline reel playback for rows with expired CDN links.

            Trigger: ${{ github.event_name }}${{ inputs.force_all && ' (force all)' || '' }}
