# Submit sitemap URLs to IndexNow after deploy.
#
# Google Indexing API is intentionally NOT used for ordinary WHD pages
# (API is limited to JobPosting / livestream BroadcastEvent). Use Search Console
# sitemaps for Google discovery. See scripts/submit-google-indexing.mjs.
#
# One-time setup:
# 1. IndexNow: set INDEXNOW_KEY in .env (local) and GitHub secret INDEXNOW_KEY
#    (CI build writes dist/{key}.txt).
# 2. Optional: enable Cloudflare Crawler Hints for ongoing IndexNow pings.
#
# Owner cleanup: GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON / GCP Indexing API credentials
# may be unused now — revoke in GCP + Search Console when ready (do not commit secrets).
#
# Run manually after a production deploy, or on schedule once credentials are set.

name: Submit indexing

on:
  workflow_dispatch:
    inputs:
      feed:
        description: "Sitemap feed"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - primary
          - virtual
          - video
      dry_run:
        description: "Dry run (no API calls)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  submit:
    name: Submit URLs (IndexNow)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify secrets (live run)
        if: inputs.dry_run != true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "ERROR: INDEXNOW_KEY secret is not set"
            exit 1
          fi

      - name: Build sitemaps
        run: npm run build
        env:
          VITE_SITE_URL: https://womenshealthduo.com
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Submit to IndexNow
        run: |
          ARGS="--feed=${{ inputs.feed }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          npm run submit:indexnow -- $ARGS
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
