# Deploy static site to GitHub Pages.
#
# BEFORE THIS WORKS (one-time per repo):
# 1. GitHub repo → Settings → Pages
# 2. Under "Build and deployment", set Source to: "GitHub Actions" (not "Deploy from a branch")
# 3. Save. The next successful run of this workflow will publish the site.
#
# CUSTOM DOMAIN (womenshealthduo.com — you connect DNS at your registrar):
# - `public/CNAME` is copied into `dist/` at build time so Pages knows the hostname.
# - After the first deploy: Settings → Pages → Custom domain → enter womenshealthduo.com
# - Add DNS A/AAAA records GitHub shows for apex domain, then enable "Enforce HTTPS".
#
# Docs: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-custom-domain-for-your-github-pages-site

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Canonical URL for meta, sitemap, robots (must match your live domain)
          VITE_SITE_URL: https://womenshealthduo.com

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -s dist/index.html
          test -f dist/404.html
          test -d dist/assets
          test -f dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # v4+ excludes dotfiles by default; `.nojekyll` must be included for GitHub Pages
          include-hidden-files: true

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
