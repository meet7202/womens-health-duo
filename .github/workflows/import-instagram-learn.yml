# Import Instagram reel or post into Learn hub (append-only; opens PR)

name: Import Instagram to Learn

on:
  workflow_dispatch:
    inputs:
      instagram_url:
        description: "Instagram reel or post URL (optional if instagram-queue.txt has URLs)"
        required: false
        type: string
  push:
    paths:
      - "instagram-queue.txt"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-instagram-learn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    name: Import to Learn hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Install dependencies
        run: npm ci

      - name: Import Instagram URL(s)
        id: import
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.instagram_url }}" ]; then
            node scripts/append-instagram-learn.mjs "${{ inputs.instagram_url }}"
          elif grep -vE '^\s*(#|$)' instagram-queue.txt | grep -q .; then
            node scripts/append-instagram-learn.mjs --queue instagram-queue.txt
          else
            echo "No URL in workflow input and instagram-queue.txt has no URLs."
          fi
          if git diff --quiet -- src/data public/images/hub-thumbs instagram-queue.txt; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Format changed files
        if: steps.import.outputs.has_changes == 'true'
        run: npx prettier --write src/data/knowledgeHubInstagramReels.json src/data/knowledgeHubInstagramPosts.json public/images/hub-thumbs instagram-queue.txt

      - name: Verify
        if: steps.import.outputs.has_changes == 'true'
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run build
          npm run audit:seo-titles
          npm run audit:seo-descriptions
          npm run audit:seo-h1
          npm run audit:seo-headings
          npm run audit:seo-sitemap
        env:
          VITE_SITE_URL: https://womenshealthduo.com

      - name: Create pull request
        if: steps.import.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: learn/import-instagram-${{ github.run_id }}
          delete-branch: true
          commit-message: "Import Instagram clip(s) to Learn hub"
          title: "Learn hub: import Instagram clip(s)"
          body: |
            Automated append-only import from [Import Instagram to Learn](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            - Existing Learn hub rows unchanged (SEO-safe)
            - New watch page(s) in primary + video sitemap after deploy
            - Review thumbnails and captions before merge

            Trigger: ${{ github.event_name }}${{ inputs.instagram_url && format(' — `{0}`', inputs.instagram_url) || '' }}
