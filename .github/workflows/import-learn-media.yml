# Import Learn hub clip (Instagram or YouTube; append-only; opens PR)

name: Import Learn media

on:
  workflow_dispatch:
    inputs:
      media_url:
        description: "Instagram or YouTube URL (optional if learn-queue.txt has URLs)"
        required: false
        type: string
  push:
    paths:
      - "learn-queue.txt"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-learn-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    name: Import to Learn hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Install dependencies
        run: npm ci

      - name: Import URL(s)
        id: import
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.media_url }}" ]; then
            node scripts/append-learn-media.mjs "${{ inputs.media_url }}"
          elif grep -vE '^\s*(#|$)' learn-queue.txt | grep -q .; then
            node scripts/append-learn-media.mjs --queue learn-queue.txt
          else
            echo "No URL in workflow input and learn-queue.txt has no URLs."
          fi
          if git diff --quiet -- src/data public/images/hub-thumbs learn-queue.txt; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Format changed files
        if: steps.import.outputs.has_changes == 'true'
        run: |
          npx prettier --write \
            src/data/knowledgeHubInstagramReels.json \
            src/data/knowledgeHubInstagramPosts.json \
            src/data/knowledgeHubVideos.ts \
            src/data/knowledgeHubYoutubeCaptions.json \
            public/images/hub-thumbs \
            learn-queue.txt

      - name: Verify
        if: steps.import.outputs.has_changes == 'true'
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run build
          npm run audit:seo-titles
          npm run audit:seo-descriptions
          npm run audit:seo-h1
          npm run audit:seo-headings
          npm run audit:seo-sitemap
        env:
          VITE_SITE_URL: https://womenshealthduo.com

      - name: Create pull request
        if: steps.import.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: learn/import-media-${{ github.run_id }}
          delete-branch: true
          commit-message: "Import Learn hub clip(s)"
          title: "Learn hub: import clip(s)"
          body: |
            Automated append-only import from [Import Learn media](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Supports Instagram reel / post / carousel and YouTube Short or video.
            Existing Learn hub rows unchanged (SEO-safe).
            New watch page(s) in primary + video sitemap after deploy (reels + YouTube).
            Review thumbnails and captions before merge.

            Trigger: ${{ github.event_name }}${{ inputs.media_url && format(' — `{0}`', inputs.media_url) || '' }}
