# Import one Learn hub clip (Instagram or YouTube) → verify → push main → deploy.
# Actions UI: paste one URL in media_url. Skips PRs (GITHUB_TOKEN cannot open PRs on this repo).

name: Import Learn media

on:
  workflow_dispatch:
    inputs:
      media_url:
        description: "Instagram reel/post/carousel or YouTube Short/video URL (one clip per run)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: import-learn-media
  cancel-in-progress: false

jobs:
  import:
    name: Import one clip to Learn hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Install dependencies
        run: npm ci

      - name: Import clip
        id: import
        env:
          MEDIA_URL: ${{ inputs.media_url }}
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$MEDIA_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$URL" ]; then
            echo "media_url is required."
            exit 1
          fi
          echo "Importing: $URL"
          node scripts/append-learn-media.mjs "$URL"
          if git diff --quiet -- src/data public/images/hub-thumbs; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Clip already in Learn hub (no file changes)."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Format changed files
        if: steps.import.outputs.has_changes == 'true'
        run: |
          npx prettier --write \
            src/data/knowledgeHubInstagramReels.json \
            src/data/knowledgeHubInstagramPosts.json \
            src/data/knowledgeHubVideos.ts \
            src/data/knowledgeHubYoutubeCaptions.json \
            public/images/hub-thumbs

      - name: Verify
        if: steps.import.outputs.has_changes == 'true'
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run build
          npm run audit:seo-titles
          npm run audit:seo-descriptions
          npm run audit:seo-h1
          npm run audit:seo-headings
          npm run audit:seo-sitemap
        env:
          VITE_SITE_URL: https://womenshealthduo.com

      - name: Push to main
        if: steps.import.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data public/images/hub-thumbs
          git diff --staged --quiet && exit 0
          git commit -m "Import Learn hub clip: ${{ inputs.media_url }}"
          git push origin HEAD:main

      - name: Trigger GitHub Pages deploy
        if: steps.import.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-github-pages.yml --ref main
