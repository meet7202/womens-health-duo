<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Recovery goals for diastasis focused on comfort, daily function and strength, with no flat-stomach promise">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf6f4"/>
      <stop offset="100%" stop-color="#f3e7ea"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="120" fill="#e8c5cd" opacity="0.35"/>
  <circle cx="80" cy="600" r="140" fill="#d9e4df" opacity="0.4"/>
  <text x="60" y="70" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#8a4b5c">Women's Health Duo</text>
  <text x="60" y="120" font-family="Georgia, serif" font-size="34" fill="#2f2430">Can diastasis recti improve on its own, or do I need physiotherapy?</text>
  <text x="60" y="168" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7a6670">Topic lead: Dr. Zalak Shah (PT) · Patient education, not a diagnosis</text>
  
  <rect x="60" y="210" width="500" height="130" rx="18" fill="#fff" stroke="#e8d5d8" stroke-width="2"/>
  <text x="84" y="262" font-family="Georgia, serif" font-size="20" fill="#5c2a3a"><tspan x="84" dy="0">1. Can diastasis improve on its own?</tspan></text>

  <rect x="600" y="210" width="500" height="130" rx="18" fill="#fff" stroke="#e8d5d8" stroke-width="2"/>
  <text x="624" y="262" font-family="Georgia, serif" font-size="20" fill="#5c2a3a"><tspan x="624" dy="0">2. Does a smaller gap mean full recovery?</tspan></text>

  <rect x="60" y="370" width="500" height="130" rx="18" fill="#fff" stroke="#e8d5d8" stroke-width="2"/>
  <text x="84" y="422" font-family="Georgia, serif" font-size="20" fill="#5c2a3a"><tspan x="84" dy="0">3. What can physiotherapy add?</tspan></text>

  <rect x="600" y="370" width="500" height="130" rx="18" fill="#fff" stroke="#e8d5d8" stroke-width="2"/>
  <text x="624" y="422" font-family="Georgia, serif" font-size="20" fill="#5c2a3a"><tspan x="624" dy="0">4. Is it too late months or years later?</tspan></text>
  <text x="60" y="540" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#8a4b5c">WOMEN'S HEALTH DUO CLINICIANS</text>
  <clipPath id="clip-zalak"><circle cx="98" cy="592" r="38"/></clipPath>
  <image href="data:image/jpeg;base64," x="60" y="554" width="76" height="76" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-zalak)"/>
  <circle cx="98" cy="592" r="38" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="98" cy="592" r="39.5" fill="none" stroke="#c98a9a" stroke-width="1.5"/>
  <text x="152" y="588" font-family="Georgia, serif" font-size="19" fill="#2f2430">Dr. Zalak Shah (PT)</text>
  <text x="152" y="610" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b5a60">Women's health physiotherapy · STOTT Pilates</text>
  <clipPath id="clip-charmi"><circle cx="508" cy="592" r="38"/></clipPath>
  <image href="data:image/jpeg;base64," x="470" y="554" width="76" height="76" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-charmi)"/>
  <circle cx="508" cy="592" r="38" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="508" cy="592" r="39.5" fill="none" stroke="#c98a9a" stroke-width="1.5"/>
  <text x="562" y="588" font-family="Georgia, serif" font-size="19" fill="#2f2430">Dr. Charmi Shah</text>
  <text x="562" y="610" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b5a60">OB-GYN · IVF · Laparoscopy</text>
  <text x="1160" y="630" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8a4b5c" opacity="0.75">@womenshealthduo</text>
