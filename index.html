<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>@@PAGE_TITLE@@</title>
    <meta name="description" content="@@PAGE_META_DESCRIPTION@@" />
    <meta name="keywords" content="@@SEO_KEYWORDS@@" />
    <meta name="author" content="@@SEO_SITE_NAME@@" />
    <!-- @@PAGE_ROBOTS@@: per-route indexability (SEO-02); do not hardcode conflicting googlebot/bingbot. -->
    <meta name="robots" content="@@PAGE_ROBOTS@@" />
    <meta name="language" content="English" />
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    <meta name="theme-color" content="#9f4c38" />
    <meta name="format-detection" content="telephone=yes" />

    <link rel="canonical" href="@@PAGE_CANONICAL@@" />
    <!-- @@SEO_SITEMAP_URL@@: full sitemap.xml URL; replaced at build (see vite.config.ts). -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="@@SEO_SITEMAP_URL@@" />
    <link
      rel="describedby"
      type="text/plain"
      title="Machine-readable site overview for assistants"
      href="@@SEO_LLMS_TXT_URL@@"
    />
    <link
      rel="alternate"
      type="text/plain"
      title="Machine-readable site overview for assistants"
      href="@@SEO_LLMS_TXT_URL@@"
    />
    <link
      rel="service-doc"
      type="application/json"
      title="Agent skills discovery index"
      href="@@SEO_AGENT_SKILLS_INDEX_URL@@"
    />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="%BASE_URL%favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="%BASE_URL%favicon.svg" color="#9f4c38" />

    <!-- @@PAGE_OG_*@@: per-route Open Graph (SEO-03 / SEO-21); watch pages use poster + video.other. -->
    <meta property="og:type" content="@@PAGE_OG_TYPE@@" />
    <meta property="og:site_name" content="@@SEO_SITE_NAME@@" />
    <meta property="og:url" content="@@PAGE_OG_URL@@" />
    <meta property="og:title" content="@@PAGE_OG_TITLE@@" />
    <meta property="og:description" content="@@PAGE_OG_DESCRIPTION@@" />
    <meta property="og:image" content="@@PAGE_OG_IMAGE@@" />
    <meta property="og:image:alt" content="@@PAGE_OG_IMAGE_ALT@@" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="@@PAGE_TW_TITLE@@" />
    <meta name="twitter:description" content="@@PAGE_TW_DESCRIPTION@@" />
    <meta name="twitter:image" content="@@PAGE_OG_IMAGE@@" />
    <meta name="twitter:image:alt" content="@@PAGE_OG_IMAGE_ALT@@" />

    <!-- Self-hosted fonts (public/fonts) — no fonts.googleapis.com / fonts.gstatic.com chain. -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/dm-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/cormorant-garamond-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="%BASE_URL%fonts/fonts.css" />
    <!-- Italic faces after first paint -->
    <link
      rel="stylesheet"
      href="%BASE_URL%fonts/fonts-italic.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link rel="stylesheet" href="%BASE_URL%fonts/fonts-italic.css" />
    </noscript>
    <!--
      Crawl `#static-seo-shell` stays in HTML for no-JS agents / Markdown worker.
      JS visitors must not see it (esp. when GitHub Pages serves 404.html for a SPA path).
      Mark <html> early so CSS can hide the shell before React boots; RemoveStaticSeoShell deletes it.
    -->
    <script>
      document.documentElement.classList.add("js");
    </script>
    <style>
      html.js #static-seo-shell {
        display: none !important;
      }
    </style>
  </head>

  <body>
    @@PAGE_STATIC_FALLBACK@@
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
