<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>@@PAGE_TITLE@@</title>
    <meta name="description" content="@@PAGE_META_DESCRIPTION@@" />
    <meta name="keywords" content="@@SEO_KEYWORDS@@" />
    <meta name="author" content="@@SEO_SITE_NAME@@" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    <meta name="theme-color" content="#b85c4e" />
    <meta name="format-detection" content="telephone=yes" />

    <link rel="canonical" href="@@PAGE_CANONICAL@@" />
    <!-- @@SEO_SITEMAP_URL@@: full sitemap.xml URL; replaced at build (see vite.config.ts). -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="@@SEO_SITEMAP_URL@@" />
    <link
      rel="describedby"
      type="text/plain"
      title="Machine-readable site overview for assistants"
      href="@@SEO_LLMS_TXT_URL@@"
    />
    <link
      rel="alternate"
      type="text/plain"
      title="Machine-readable site overview for assistants"
      href="@@SEO_LLMS_TXT_URL@@"
    />
    <link
      rel="service-doc"
      type="application/json"
      title="Agent skills discovery index"
      href="@@SEO_AGENT_SKILLS_INDEX_URL@@"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="mask-icon" href="%BASE_URL%favicon.svg" color="#a84a3d" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="@@SEO_SITE_NAME@@" />
    <meta property="og:url" content="@@PAGE_OG_URL@@" />
    <meta property="og:title" content="@@PAGE_OG_TITLE@@" />
    <meta property="og:description" content="@@PAGE_OG_DESCRIPTION@@" />
    <meta property="og:image" content="@@SEO_SITE_URL@@@@SEO_OG_IMAGE_PATH@@" />
    <meta
      property="og:image:alt"
      content="@@SEO_SITE_NAME@@ — holistic women's healthcare in India"
    />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="@@PAGE_TW_TITLE@@" />
    <meta name="twitter:description" content="@@PAGE_TW_DESCRIPTION@@" />
    <meta name="twitter:image" content="@@SEO_SITE_URL@@@@SEO_OG_IMAGE_PATH@@" />

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    @@PAGE_STATIC_FALLBACK@@
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
